<title>Art Detalhe — Controle de Tempo</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C8900A;--gold-lt:#E8B84B;--bg:#111;--bg2:#1A1A1A;--bg3:#222;--border:#2A2A2A;--text:#E8E0D0;--muted:#888;--green:#4CAF7A;--red:#C04040}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden}
.page{display:none;flex-direction:column;min-height:100vh}
.page.active{display:flex}
header{background:var(--bg2);border-bottom:2px solid var(--gold);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.hdr-left{display:flex;align-items:center;gap:12px}
.brand-nome{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold-lt);line-height:1}
.brand-tag{font-size:10px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.h-tit{font-size:17px;font-weight:700;color:var(--text);line-height:1}
.h-sub{font-size:12px;color:var(--gold);margin-top:2px}
main{padding:18px 16px;display:flex;flex-direction:column;gap:14px;max-width:520px;margin:0 auto;width:100%;flex:1}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.sec-tit{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.card-dest{background:linear-gradient(145deg,#1E1600,var(--bg2));border:1.5px solid var(--gold);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.dest-lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.dest-num{font-family:'Playfair Display',serif;font-size:50px;color:var(--gold-lt);line-height:1;margin:4px 0}
.dest-sub{font-size:11px;color:#666}
.proj-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .2s,transform .1s;-webkit-tap-highlight-color:transparent}
.proj-card:active{transform:scale(.985);border-color:var(--gold)}
.proj-nome{font-family:'Playfair Display',serif;font-size:17px;color:var(--text)}
.proj-cli{font-size:12px;color:var(--muted);margin-top:3px}
.proj-data{font-size:11px;color:#555;margin-top:2px}
.proj-tempo{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold-lt);white-space:nowrap}
.btn{border:none;cursor:pointer;font-family:'Montserrat',sans-serif;font-weight:700;border-radius:10px;padding:14px;font-size:15px;width:100%;transition:opacity .2s,transform .1s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-lt));color:#111}
.btn-outline{background:transparent;color:var(--muted);border:1px solid var(--border);color:var(--muted)}
.btn-green{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn-amber{background:var(--bg2);color:var(--gold);border:1.5px solid var(--gold)}
.btn-back{background:transparent;border:none;color:var(--gold-lt);font-size:22px;cursor:pointer;padding:0 4px;line-height:1}
.btn-ico{background:transparent;border:1px solid #4A1A1A;color:var(--red);padding:7px 11px;border-radius:8px;cursor:pointer;font-size:15px}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:8px;white-space:nowrap;font-family:'Montserrat',sans-serif;font-weight:700;cursor:pointer;border:none}
.btn-sm-gold{background:#1E1600;border:1.5px solid var(--gold);color:var(--gold-lt)}
.btn-sm-gr{background:transparent;border:1px solid var(--green);color:var(--green)}
.btn-del{background:transparent;border:none;color:#664040;font-size:22px;cursor:pointer;line-height:1}
.concluido-box{background:#0D2B1A;border:1.5px solid var(--green);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.concluido-box span{color:var(--green);font-weight:700;font-size:13px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--bg2);border:1.5px solid var(--border);border-radius:16px;padding:26px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:16px}
.modal-tit{font-family:'Playfair Display',serif;font-size:21px;color:var(--text)}
.modal-sub{font-size:13px;color:var(--muted);line-height:1.6}
.btn-danger{background:#8B1A1A;color:#fff;border:none;padding:14px 20px;border-radius:10px;font-size:14px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;flex:1}
.btn-ok{background:#1A6B3A;color:#fff;border:none;padding:14px 20px;border-radius:10px;font-size:14px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;flex:1}
.fase-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fase-btn{background:#111;border:1px solid var(--border);color:var(--muted);padding:14px 8px;border-radius:10px;font-size:12px;font-weight:600;font-family:'Montserrat',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s;-webkit-tap-highlight-color:transparent}
.fase-btn.ativo{color:var(--text)!important;font-weight:700}
.fase-icon{font-size:24px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:2px}
.lbl-sm{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#777;display:block;margin-bottom:4px}
input,select,textarea{background:#0D0D0D;border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:8px;font-size:15px;font-family:'Montserrat',sans-serif;width:100%;outline:none;transition:border-color .2s;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:none}
.row{display:flex;gap:10px}
.barra-bg{height:7px;background:#222;border-radius:4px;overflow:hidden}
.barra-fill{height:100%;border-radius:4px;transition:width .4s ease}
.hist-item{border-top:1px solid #1E1E1E;padding-top:11px;margin-top:11px}
.hist-item:first-child{border-top:none;margin-top:0;padding-top:0}
.reg-badge{background:#1E1600;border:1px solid var(--gold);color:var(--gold-lt);font-weight:700;padding:3px 10px;border-radius:20px;font-size:12px;white-space:nowrap}
.rel-linha{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1E1E1E}
.rel-linha:last-child{border-bottom:none}
.rel-lbl{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.06em}
.rel-val{font-size:14px;font-weight:700;color:var(--text)}
.rel-total-box{background:linear-gradient(135deg,#1E1600,#111);border:1.5px solid var(--gold);border-radius:10px;padding:16px;text-align:center;margin-bottom:4px}
.rel-total-lbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.rel-total-num{font-family:'Playfair Display',serif;font-size:44px;color:var(--gold-lt);line-height:1.2}
.empty{text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-tit{font-family:'Playfair Display',serif;font-size:20px;color:#444}
.empty-sub{font-size:13px;color:#333}
#etapas-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin-bottom:0}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px}
.ck-section{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
</style>
</head>

  {id:"montagem",  label:"Fabricação", icon:"🔧", cor:"#8B6010"},

  dataEntrega:"", mdf:"",
  montagemLocal:"", instalacaoTerc:"", instalacaoEquipe:"", entregaTerc:"", corteTerc:"", fitaTerc:"", furacaoTerc:"",

const KEY = "artdetalhe-v1";
let dados = {projetos:[]};
let pidAtivo = null;
let faseSelecionada = FASES[0].id;

function fmt(min) {
  const h=Math.floor(min/60), m=min%60;
  return h===0?m+"min":h+"h"+(m>0?" "+m+"min":"");
}
function somaMin(regs){ return regs.reduce((a,r)=>a+r.horas*60+r.minutos,0); }
function hoje(){
  const d=new Date();
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function fmtData(s){
  if(!s) return '';
  if(s.includes('/')) return s;
  const [y,m,d]=s.split('-');
  return d+'/'+m+'/'+y;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }

function salvar(){
  localStorage.setItem(KEY, JSON.stringify(dados));
  salvarBackupAuto();
  // Sync to Firebase
  const db = getDB();
  if (!db) return;
  const projetosObj = {};
  dados.projetos.forEach(p => { projetosObj[p.id] = p; });
  db.ref('projetos').set(projetosObj).catch(()=>{});
  // Save backup to Firebase too (only if has projects)
  if (dados.projetos.length > 0) {
    const backupData = {
      timestamp: Date.now(),
      data: new Date().toLocaleString('pt-BR'),
      projetos: projetosObj
    };
    db.ref('backup_auto').set(backupData).catch(()=>{});
  }
}
function carregarFirebase(cb) {
  try {
    const db = getDB();
    if (!db) { cb(); return; }
    db.ref('projetos').once('value').then(snap => {
      const val = snap.val();
      if (val && Object.keys(val).length > 0) {
        dados = { projetos: Object.values(val).map(p=>({...p, checklist:p.checklist||{...CK_VAZIO}, concluidoEm:p.concluidoEm||null})) };
        dados.projetos.sort((a,b) => b.criadoEm > a.criadoEm ? 1 : -1);
        localStorage.setItem(KEY, JSON.stringify(dados));
        salvarBackupAuto();
        cb();
      } else {
        // projetos vazio — tenta restaurar do backup_auto no Firebase
        db.ref('backup_auto').once('value').then(bSnap => {
          const bVal = bSnap.val();
          if (bVal && bVal.projetos && Object.keys(bVal.projetos).length > 0) {
            dados = { projetos: Object.values(bVal.projetos).map(p=>({...p, checklist:p.checklist||{...CK_VAZIO}, concluidoEm:p.concluidoEm||null})) };
            dados.projetos.sort((a,b) => b.criadoEm > a.criadoEm ? 1 : -1);
            // Restore projetos in Firebase
            const projetosObj = {};
            dados.projetos.forEach(p => { projetosObj[p.id] = p; });
            db.ref('projetos').set(projetosObj).catch(()=>{});
            localStorage.setItem(KEY, JSON.stringify(dados));
            salvarBackupAuto();
          }
          cb();
        }).catch(() => cb());
      }
    }).catch(() => cb());
  } catch(e) { cb(); }
}

function carregar(){
  try {
    const r = localStorage.getItem(KEY);
    if(r){ dados = JSON.parse(r); return; }
    // migrate old keys
    const antigas = ["artdetalhe-projetos","artdetalhe-v5","artdetalhe-v4"];
    for(const k of antigas){
      const v = localStorage.getItem(k);
      if(v){ dados = JSON.parse(v); dados.projetos = dados.projetos.map(p=>({...p,checklist:p.checklist||{...CK_VAZIO},concluidoEm:p.concluidoEm||null})); salvar(); break; }
    }
  } catch { dados = {projetos:[]}; }
}

function proj(){ return dados.projetos.find(p=>p.id===pidAtivo); }

function irPara(pgId){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(pgId).classList.add('active');
  window.scrollTo(0,0);
  if(pgId==='pg-lista') renderLista();
  if(pgId==='pg-projeto') renderProjeto();
  if(pgId==='pg-checklist') renderChecklist();
  if(pgId==='pg-relatorio') renderRelatorio();
  if(pgId==='pg-registro'){ renderFaseGrid(); document.getElementById('reg-data').value=hojeISO(); }
}

// ── LISTA ──────────────────────────────────────────────────────────────────
function renderLista(){
  const el = document.getElementById('lista-projetos');
  if(!dados.projetos.length){
    el.innerHTML = `<div class="empty"><img src="${LOGO}" style="height:60px;width:auto;opacity:.3"/><div class="empty-tit">Nenhum projeto ainda</div><div class="empty-sub">Crie seu primeiro projeto acima.</div></div>`;
    return;
  }
  el.innerHTML = dados.projetos.map(p=>{
    const min = somaMin(p.registros||[]);
    const pct = Math.min(100,(min/480)*100);
    return `<div class="proj-card" onclick="abrirProjeto('${p.id}')" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <div class="proj-nome">${p.concluidoEm?'✅ ':''}<span>${p.nome}</span></div>
          ${p.cliente?`<div class="proj-cli">👤 ${p.cliente}</div>`:''}
          <div class="proj-data">📅 ${fmtData(p.criadoEm)}</div>
        </div>
        <div class="proj-tempo">${fmt(min)}</div>
      </div>
      <div class="barra-bg"><div class="barra-fill" style="width:${pct}%;background:linear-gradient(90deg,#C8900A,#E8B84B)"></div></div>
    </div>`;
  }).join('');
}

function abrirProjeto(id){ pidAtivo=id; irPara('pg-projeto'); }

// ── PROJETO ────────────────────────────────────────────────────────────────
function renderProjeto(){
  const p = proj(); if(!p) return;
  document.getElementById('proj-titulo').textContent = p.nome;
  document.getElementById('proj-subtitulo').textContent = p.cliente||'';
  const regs = p.registros||[];
  const total = somaMin(regs);
  document.getElementById('proj-total').textContent = fmt(total);
  document.getElementById('proj-registros').textContent = `${regs.length} registro(s) · desde ${fmtData(p.criadoEm)}`;

  // Fases
  const porFase = FASES.map(f=>({ ...f, min:regs.filter(r=>r.fase===f.id).reduce((a,r)=>a+r.horas*60+r.minutos,0) })).filter(f=>f.min>0);
  const fc = document.getElementById('proj-fases-card');
  const fe = document.getElementById('proj-fases');
  if(porFase.length){
    fc.style.display='flex';
    fe.innerHTML = porFase.map(f=>`
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
          <span>${f.icon} ${f.label}</span><span style="font-weight:700;color:#E8B84B">${fmt(f.min)}</span>
        </div>
        <div class="barra-bg"><div class="barra-fill" style="width:${total>0?((f.min/total)*100).toFixed(1):0}%;background:${f.cor}"></div></div>
      </div>`).join('');
  } else { fc.style.display='none'; }

  // Botões
  const ck = p.checklist||{};
  const ckOk = Object.values(ck).some(v=>typeof v==='object'?Object.values(v).some(x=>x):v);
  const botoes = document.getElementById('proj-botoes');
  if(!p.concluidoEm){
    botoes.innerHTML = `
      <button class="btn btn-gold" onclick="irPara('pg-registro')" style="margin-bottom:10px">+ Registrar Tempo</button>
      <button class="btn btn-amber" onclick="irPara('pg-checklist')" style="margin-bottom:10px">${ckOk?'✅ Check Lista (preenchida)':'📋 Preencher Check Lista'}</button>
      <button class="btn btn-green" onclick="abrirModalConcluir()">✅ Concluir Projeto</button>`;
  } else {
    botoes.innerHTML = `
      <div class="concluido-box" style="margin-bottom:10px">
        <span>✅ Concluído em ${p.concluidoEm}</span>
        <div style="display:flex;gap:8px">
          <button class="btn-sm btn-sm-gold" onclick="irPara('pg-relatorio')">📄 Relatório</button>
          <button class="btn-sm btn-sm-gr" onclick="abrirModalConcluir()">Reabrir</button>
        </div>
      </div>
      <button class="btn btn-amber" onclick="irPara('pg-checklist')">${ckOk?'✅ Check Lista (preenchida)':'📋 Preencher Check Lista'}</button>`;
  }

  // Histórico
  const hc = document.getElementById('proj-hist-card');
  const he = document.getElementById('proj-hist');
  if(regs.length){
    hc.style.display='flex';
    he.innerHTML = [...regs].reverse().map(r=>{
      const f = FASES.find(x=>x.id===r.fase)||{};
      return `<div class="hist-item">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div>
            <div style="font-weight:700;font-size:14px;color:#E8B84B">${f.icon||''} ${f.label||r.fase}</div>
            <div style="font-size:12px;color:#888;margin-top:2px">📅 ${fmtData(r.data)}</div>
            ${r.obs?`<div style="font-size:13px;color:#ccc;margin-top:3px">${r.obs}</div>`:''}
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <span class="reg-badge">${fmt(r.horas*60+r.minutos)}</span>
            <button class="btn-del" onclick="excluirReg('${r.id}')">×</button>
          </div>
        </div>
      </div>`;
    }).join('');
  } else { hc.style.display='none'; }
}

// ── REGISTRO ───────────────────────────────────────────────────────────────
function renderFaseGrid(){
  document.getElementById('fase-grid').innerHTML = FASES.map(f=>`
    <button class="fase-btn${faseSelecionada===f.id?' ativo':''}" id="fb-${f.id}"
      style="${faseSelecionada===f.id?`border-color:${f.cor};background:${f.cor}22`:''}"
      onclick="selecionarFase('${f.id}','${f.cor}')">
      <span class="fase-icon">${f.icon}</span><span>${f.label}</span>
    </button>`).join('');
}

function selecionarFase(id,cor){
  faseSelecionada=id;
  document.querySelectorAll('.fase-btn').forEach(b=>{ b.classList.remove('ativo'); b.style.borderColor=''; b.style.background=''; });
  const b=document.getElementById('fb-'+id);
  b.classList.add('ativo'); b.style.borderColor=cor; b.style.background=cor+'22';
}

function salvarRegistro(){
  const h=parseInt(document.getElementById('reg-horas').value)||0;
  const m=parseInt(document.getElementById('reg-min').value)||0;
  if(h===0&&m===0){ alert('Informe o tempo gasto.'); return; }
  const p=proj(); if(!p) return;
  p.registros.push({ id:uid(), data:document.getElementById('reg-data').value, fase:faseSelecionada, horas:h, minutos:m, obs:document.getElementById('reg-obs').value });
  salvar(); document.getElementById('reg-obs').value=''; irPara('pg-projeto');
}

function excluirReg(rid){
  const p=proj(); if(!p) return;
  p.registros = p.registros.filter(r=>r.id!==rid);
  salvar(); renderProjeto();
}

// ── PROJETO CRUD ───────────────────────────────────────────────────────────
function criarProjeto(){
  const nome=document.getElementById('novo-nome').value.trim();
  if(!nome){ alert('Informe o nome do projeto.'); return; }
  const p={ id:uid(), nome, cliente:document.getElementById('novo-cliente').value.trim(), criadoEm:hoje(), concluidoEm:null, registros:[], checklist:{...CK_VAZIO} };
  dados.projetos.unshift(p); salvar();
  document.getElementById('novo-nome').value='';
  document.getElementById('novo-cliente').value='';
  pidAtivo=p.id; irPara('pg-projeto');
}

function confirmarExcluir(){
  abrirModal('Excluir projeto?','Todos os registros serão apagados permanentemente.','Excluir','var(--red)',()=>{
    dados.projetos=dados.projetos.filter(p=>p.id!==pidAtivo);
    salvar(); pidAtivo=null; fecharModal(); irPara('pg-lista');
  });
}

function abrirModalConcluir(){
  const p=proj();
  if(p.concluidoEm){
    abrirModal('Reabrir projeto?','O projeto voltará para em andamento.','Reabrir','#1A6B3A',()=>{ p.concluidoEm=null; salvar(); fecharModal(); renderProjeto(); });
  } else {
    abrirModal('Concluir projeto?','Confirma que todos os serviços foram finalizados?','Concluir','#1A6B3A',()=>{ p.concluidoEm=hoje(); salvar(); fecharModal(); renderProjeto(); });
  }
}

// ── MODAL ──────────────────────────────────────────────────────────────────
let modalCb=null;
function abrirModal(tit,sub,btnTxt,btnCor,cb){
  document.getElementById('modal-tit').textContent=tit;
  document.getElementById('modal-sub').textContent=sub;
  const btn=document.getElementById('modal-btn');
  btn.textContent=btnTxt; btn.style.cssText=`background:${btnCor};color:#fff;border:none;padding:14px 20px;border-radius:10px;font-size:14px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;flex:1`;
  modalCb=cb; btn.onclick=cb;
  document.getElementById('modal').style.display='flex';
}
function fecharModal(e){ if(e&&e.target!==document.getElementById('modal')) return; document.getElementById('modal').style.display='none'; modalCb=null; }

function salvarChecklist(){

// ── RELATÓRIO ──────────────────────────────────────────────────────────────
function renderRelatorio(){
  const p=proj(); if(!p) return;
  document.getElementById('rel-subtitulo').textContent=p.nome;
  const regs=p.registros||[];
  const total=somaMin(regs);
  const porFase=FASES.map(f=>({...f,min:regs.filter(r=>r.fase===f.id).reduce((a,r)=>a+r.horas*60+r.minutos,0),regs:regs.filter(r=>r.fase===f.id)})).filter(f=>f.min>0);
  const dias=p.concluidoEm?Math.ceil((new Date(p.concluidoEm)-new Date(p.criadoEm))/86400000)+1:null;

  const rows=[['Projeto',p.nome],p.cliente?['Cliente',p.cliente]:null,['Início',fmtData(p.criadoEm)],p.concluidoEm?['Conclusão',fmtData(p.concluidoEm)]:null,dias?['Duração',dias+' dia(s)']:null,['Registros',regs.length]].filter(Boolean);

  document.getElementById('rel-main').innerHTML=`
    <div style="display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px">
      <img src="${LOGO}" style="height:44px;width:auto"/>
      <div><div style="font-family:'Playfair Display',serif;font-size:18px;color:#E8B84B">Relatório de Projeto</div>
      <div style="font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;margin-top:3px">Marcenaria Art Detalhe</div></div>
    </div>
    <div class="card">
      <div class="sec-tit">📋 Dados do Projeto</div>
      ${rows.map(([l,v])=>`<div class="rel-linha"><span class="rel-lbl">${l}</span><span class="rel-val">${v}</span></div>`).join('')}
    </div>
    <div class="card">
      <div class="sec-tit">⏱ Resumo de Tempo</div>
      <div class="rel-total-box"><div class="rel-total-lbl">TEMPO TOTAL</div><div class="rel-total-num">${fmt(total)}</div></div>
      ${porFase.map(f=>`<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>${f.icon} ${f.label}</span><span style="font-weight:700;color:#E8B84B">${fmt(f.min)}</span></div>
        <div class="barra-bg"><div class="barra-fill" style="width:${((f.min/total)*100).toFixed(1)}%;background:${f.cor}"></div></div>
        <div style="font-size:11px;color:#666;margin-top:2px">${((f.min/total)*100).toFixed(0)}% do total</div>
      </div>`).join('')}
    </div>
    ${porFase.map(f=>`<div class="card">
      <div class="sec-tit">${f.icon} ${f.label} — ${fmt(f.min)}</div>
      ${f.regs.map(r=>`<div class="hist-item">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;color:#888">📅 ${fmtData(r.data)}</span>
          <span class="reg-badge">${fmt(r.horas*60+r.minutos)}</span>
        </div>
        ${r.obs?`<div style="font-size:13px;color:#bbb;margin-top:4px">${r.obs}</div>`:''}

// ── COMPARTILHAR RELATÓRIO ────────────────────────────────────────────────
function compartilharRelWhatsApp(){
  const html = window._relHtml;
  if (!html) { alert('Gere o relatório primeiro.'); return; }

  // Tenta compartilhar arquivo
  const blob = new Blob([html], {type:'text/html'});
  const nome = window._relNome || 'relatorio.html';
  const file = new File([blob], nome, {type:'text/html'});

  // Tenta primeiro com arquivo
  if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file], title:'Relatório Art Detalhe'})
      .catch(function(e){ if(e.name!=='AbortError') tentarSemArquivo(html); });
    return;
  }

  // Fallback: compartilha como texto/link
  tentarSemArquivo(html);
}

function tentarSemArquivo(html){
  // Cria URL blob e tenta abrir
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);

  if (navigator.share) {
    navigator.share({
      title: 'Relatório Art Detalhe',
      text: 'Segue o relatório completo da Marcenaria Art Detalhe.',
      url: url
    }).catch(function(){});
  } else {
    // Último fallback: abre o blob numa nova aba
    window.open(url, '_blank');
  }
}

// ── BACKUP AUTOMÁTICO ────────────────────────────────────────────────────
const BACKUP_KEY = 'artdetalhe-backup-auto';
const MAX_BACKUPS = 5;

function salvarBackupAuto() {
  try {
    if (!dados.projetos || dados.projetos.length === 0) return;
    const backups = carregarBackups();
    const novo = {
      data: new Date().toLocaleString('pt-BR'),
      timestamp: Date.now(),
      dados: JSON.parse(JSON.stringify(dados))
    };
    backups.unshift(novo);
    // Keep only last 5 backups
    if (backups.length > MAX_BACKUPS) backups.splice(MAX_BACKUPS);
    localStorage.setItem(BACKUP_KEY, JSON.stringify(backups));
  } catch(e) {}
}

function carregarBackups() {
  try {
    const r = localStorage.getItem(BACKUP_KEY);
    return r ? JSON.parse(r) : [];
  } catch { return []; }
}

function abrirModalBackup() {
  const backups = carregarBackups();
  if (!backups.length) { alert('Nenhum backup disponível.'); return; }
  
  const lista = backups.map((b,i) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #222">
      <div>
        <div style="font-size:14px;color:#E8E0D0;font-weight:600">Backup ${i+1}</div>
        <div style="font-size:12px;color:#888">${b.data} · ${b.dados.projetos.length} projeto(s)</div>
      </div>
      <button onclick="restaurarBackup(${i})" style="background:#C8900A;color:#111;border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer">Restaurar</button>
    </div>`).join('');

  document.getElementById('modal-tit').textContent = '📦 Backups Disponíveis';
  document.getElementById('modal-sub').innerHTML = lista;
  document.getElementById('modal-btn').style.display = 'none';
  document.getElementById('modal').style.display = 'flex';
}

function restaurarBackup(idx) {
  const backups = carregarBackups();
  const b = backups[idx];
  if (!b) return;
  if (!confirm(`Restaurar backup de ${b.data}? Os dados atuais serão substituídos.`)) return;
  dados = b.dados;
  salvar();
  fecharModal();
  renderLista();
  alert('✅ Backup restaurado com sucesso!');
}

// ── EXPORTAR / IMPORTAR ──────────────────────────────────────────────────
function exportarDados(){
  const json = JSON.stringify(dados, null, 2);
  const data = new Date().toLocaleDateString('pt-BR').replace(/[/]/g,'-');
  const nome = 'artdetalhe-backup-' + data + '.json';
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const blob = new Blob([json], {type:'application/json'});

  if (isMobile) {
    const file = new File([blob], nome, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      navigator.share({
        files: [file],
        title: 'Art Detalhe Backup',
        text: 'Backup dos projetos'
      }).catch(function(){});
    } else {
      alert('Para exportar: copie a URL desta página e abra no computador.');
    }
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  }
}

function importarDados(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const importado = JSON.parse(e.target.result);
      if(!importado.projetos) throw new Error('Arquivo inválido');
      // Merge: adiciona projetos que não existem ainda (por id)
      const idsExistentes = new Set(dados.projetos.map(p=>p.id));
      let adicionados = 0;
      importado.projetos.forEach(p=>{
        if(!idsExistentes.has(p.id)){
          dados.projetos.push(p);
          adicionados++;
        }
      });
      salvar(dados);
      renderLista();
      alert('✅ Importação concluída! ' + adicionados + ' projeto(s) adicionado(s).');
    } catch(err){
      alert('❌ Erro ao importar: ' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

// ── INIT ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  carregar(); // load from localStorage immediately
  // Always go to lista after 800ms max, then try Firebase in background
  setTimeout(()=>{ irPara('pg-lista'); }, 800);
  // Firebase sync in background - won't block the app
  setTimeout(()=>{
    carregarFirebase(()=>{
      renderLista(); // refresh list with Firebase data
    });
  }, 1500);
});
</script>
